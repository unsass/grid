<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="100%" style="display:block">
    <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="0.8" cy="0.8" r="0.7" fill="#fff" opacity="0.05"/>
        </pattern>
    </defs>

    <rect width="800" height="340" fill="#1d242a"/>
    <rect width="800" height="340" fill="url(#dots)"/>
    <rect width="800" height="340" rx="12" fill="none" stroke="#33403f"/>
    <rect width="800" height="2.5" fill="#1ad1cb" opacity="0.9"/>

    <!-- grid icon -->
    <g transform="translate(400, 44)" fill="none" stroke="#1ad1cb" stroke-width="1.5">
        <rect x="-24" y="-18" width="48" height="36" rx="4" opacity="0.55"/>
        <line x1="-8" y1="-18" x2="-8" y2="18" opacity="0.7"/>
        <line x1="8" y1="-18" x2="8" y2="18" opacity="0.7"/>
        <line x1="-24" y1="-6" x2="24" y2="-6" opacity="0.7"/>
        <line x1="-24" y1="6" x2="24" y2="6" opacity="0.7"/>
        <rect x="-8" y="-6" width="16" height="12" fill="#1ad1cb" fill-opacity="0.18" stroke="none"/>
    </g>

    <!-- "grid" wordmark in Montserrat Medium (matches the docs display font) -->
    <text x="400" y="102" text-anchor="middle" font-size="30" font-weight="500" fill="#eeeeee" letter-spacing="0.5"
          font-family="Montserrat,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">grid</text>
    <text x="400" y="124" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11"
          fill="#1ad1cb" opacity="0.8">Sass functions and mixins to use grid</text>

    <!-- code mockup: configure + use -->
    <rect x="130" y="148" width="540" height="158" rx="10" fill="#151c22" stroke="#2c3942"/>
    <rect x="130" y="148" width="540" height="28" rx="10" fill="#19232b"/>
    <rect x="130" y="166" width="540" height="10" fill="#19232b"/>
    <line x1="130" y1="176" x2="670" y2="176" stroke="#2c3942" stroke-width="0.75"/>
    <circle cx="152" cy="162" r="4.5" fill="#ff5f57"/>
    <circle cx="168" cy="162" r="4.5" fill="#febc2e"/>
    <circle cx="184" cy="162" r="4.5" fill="#28c840"/>

    <g font-family="ui-monospace,Menlo,monospace" font-size="13">
        <text x="150" y="202">
            <tspan fill="#1ad1cb">@use </tspan><tspan fill="#7fd88f">"@unsass/grid"</tspan><tspan fill="#c8d0d4"> </tspan><tspan fill="#1ad1cb">with</tspan><tspan fill="#c8d0d4"> (</tspan>
        </text>
        <text x="174" y="224">
            <tspan fill="#82aaff">$columns</tspan><tspan fill="#c8d0d4">: </tspan><tspan fill="#e0a973">12</tspan><tspan fill="#c8d0d4">, </tspan><tspan fill="#82aaff">$rows</tspan><tspan fill="#c8d0d4">: </tspan><tspan fill="#e0a973">6</tspan>
        </text>
        <text x="150" y="246"><tspan fill="#c8d0d4">);</tspan></text>
        <text x="150" y="284">
            <tspan fill="#6b757a">&lt;div </tspan><tspan fill="#82aaff">class</tspan><tspan fill="#6b757a">=</tspan><tspan fill="#7fd88f">"grid grid-cols-12"</tspan><tspan fill="#6b757a">&gt;…&lt;/div&gt;</tspan>
        </text>
    </g>
</svg>
